server {
    listen 80;
    
    # 1. 프론트엔드 정적 파일 서빙 (React 화면)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA 라우팅 지원 (새로고침 시 404 방지)
        try_files $uri $uri/ /index.html;
    }
    
    # 2. 백엔드 API 프록시 설정
    location /api/ {
        # [CORS Preflight 처리] 
        # 브라우저가 "보내도 돼?" 하고 OPTIONS 요청을 보내면 Nginx가 허락
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # 실제 요청(GET, POST)은 백엔드로 넘깁니다.
        # [중요] 주소 끝에 '/'가 있어야 '/api'를 떼고 보냅니다.
        proxy_pass http://backend-service.claude-app.svc.cluster.local:8000/;
        
        # 헤더 전달 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Authorization 헤더(토큰)도 백엔드로 잘 넘어가게 설정
        proxy_pass_header Authorization;
    }

    # 에러 페이지 설정
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}